# Needed otherwise it will use the parent folder (devcontainer) as project name instead of this one that is the name from DevContainer startup 
name: "demo-dagster-arches_devcontainer"
services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:3.14

    # Clone in volume does not need this volume bind but it is required when DevContainer is created from a local folder.
    volumes:
     - ..:/workspaces/demo-dagster-arches:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    networks:
      - demo_network

networks:
  demo_network:
    driver: bridge
    name: demo_dagster_arches_network