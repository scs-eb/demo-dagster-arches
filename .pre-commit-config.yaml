---
repos:

  - repo: meta
    hooks:
      - id: check-hooks-apply

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--quiet]
        exclude: node_modules

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd demo-arches && npm run prettier:fix'
        language: system
        files: demo_arches/src
      - id: eslint
        name: eslint
        entry: bash -c 'cd demo-arches && npm run eslint:fix'
        language: system
        files: demo_arches/src
      - id: typescript
        name: typescript
        entry: bash -c 'cd demo-arches && npm run ts:check'
        language: system
        types_or: [
          "ts",
          "vue",
        ]
