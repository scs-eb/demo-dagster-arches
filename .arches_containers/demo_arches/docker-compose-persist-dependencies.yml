
services:
    nginx-demo-arches-c09fc:
      container_name: nginx-demo-arches-c09fc
      image: nginx:latest
      ports:
        - "8080:80"
      volumes:
        - ./docker/nginx-config/default.conf:/etc/nginx/conf.d/default.conf
      networks:
        - demo-arches-c09fc-network

    db-demo-arches-c09fc:
      container_name: db-demo-arches-c09fc
      image: postgis/postgis:16-3.5
      volumes:
        - ../../demo_arches-postgres-data:/var/lib/postgresql/data
        - ../../demo_arches-postgres-log:/var/log/postgresql
        - ./docker/init-unix.sql:/docker-entrypoint-initdb.d/init.sql # to set up the DB template
      ports:
        - '5433:5432'
      env_file: 
        - ./docker/env_file.env
      networks:
        - demo-arches-c09fc-network

    elastic-bindmount-init-demo-arches-c09fc:
      image: alpine
      container_name: elastic-bindmount-init-demo-arches-c09fc
      restart: "no"
      entrypoint: |
        /bin/sh -c "chown 1000:1000 /esBindMount"
      volumes:
        - ../../demo_arches-elasticsearch-data:/esBindMount


    elasticsearch-demo-arches-c09fc:
      container_name: elasticsearch-demo-arches-c09fc
      image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
      #platform: linux/arm64
      volumes:
        - ../../demo_arches-elasticsearch-data:/usr/share/elasticsearch/data
      ports:
        - "9201:9200"
        - "9301:9300"
      env_file: 
        - ./docker/env_file.env
      networks:
        - demo-arches-c09fc-network
      depends_on:
        - elastic-bindmount-init-demo-arches-c09fc

    rabbitmq-demo-arches-c09fc:
      container_name: rabbitmq-demo-arches-c09fc
      image: rabbitmq:4.1-management
      hostname: my-rabbit
      volumes:
        - rabbitmq-data-c09fc:/var/lib/rabbitmq/mnesia/rabbit@my-rabbit
        - rabbitmq-logs-c09fc:/var/log/rabbitmq/log
      ports:
        - 5673:5672
        - 15673:15672
      networks:
        - demo-arches-c09fc-network

